<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#061c37">
    <meta name="description" content="Complete your TACTIOPBOT profile with your clan name.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.tactiopbot.qd.je/profile/complete">
    <link rel="icon" type="image/png" sizes="32x32" href="/media/images/logos/tactiopbot-logo.png.jpeg">
    <link rel="icon" type="image/png" sizes="16x16" href="/media/images/logos/tactiopbot-logo.png.jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="/media/images/logos/tactiopbot-logo.png.jpeg">
    <link rel="manifest" href="/site.webmanifest">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.tactiopbot.qd.je/profile/complete">
    <meta property="og:title" content="Complete Your Profile | TACTIOPBOT">
    <meta property="og:description" content="Complete your TACTIOPBOT profile with your clan name.">
    <meta property="og:image" content="https://www.tactiopbot.qd.je/media/images/logos/tactiopbot.png.jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="TACTIOPBOT">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.tactiopbot.qd.je/profile/complete">
    <meta name="twitter:title" content="Complete Your Profile | TACTIOPBOT">
    <meta name="twitter:description" content="Complete your TACTIOPBOT profile with your clan name.">
    <meta name="twitter:image" content="https://www.tactiopbot.qd.je/media/images/logos/tactiopbot.png.jpeg">
    <meta name="twitter:image:alt" content="TACTIOPBOT logo">
    <title>Complete Your Profile | TACTIOPBOT</title>
    <link rel="preload" as="image" href="/media/images/logos/tactiopbot.png.jpeg">
    <link rel="stylesheet" href="/site.css">
    <script src="/profile.js" defer></script>
    <script src="/site.js" defer></script>
  </head>
  <body>
    <main class="account-section profile-completion">
      <a class="footer-brand" href="/" aria-label="TACTIOPBOT home">
        <img src="/media/images/logos/tactiopbot-wordmark.png" alt="">
      </a>
      <div class="auth-card">
        <p class="eyebrow">ONE LAST STEP</p>
        <h1>Complete your TACTIOPBOT profile</h1>
        <p>Your clan name is required before you can access the dashboard.</p>
        <p id="profile-identity" class="muted" aria-live="polite"></p>
        <form id="profile-completion-form" class="email-auth-form">
          <label class="field" for="clan-name">
            <span>Clan name</span>
            <input id="clan-name" class="control" type="text" maxlength="40" autocomplete="off" required>
            <small>Enter your actual clan name in Tacticool. TACTIOPBOT does not verify it with the game.</small>
          </label>
          <label class="field" for="timezone-select">
            <span>Timezone</span>
            <select id="timezone-select" class="control">
              <option value="auto">Auto-detect from browser</option>
            </select>
            <small>Choose your timezone for the next clan mission reset display. You can change this later in settings.</small>
          </label>
          <button id="complete-profile-button" class="button button-primary" type="submit">Save and continue</button>
          <p id="profile-error" class="feedback feedback-error hidden" role="alert"></p>
        </form>
        <button id="profile-logout-button" class="button button-quiet" type="button">Sign out</button>
      </div>
    </main>

    <!-- Floating AI Assistant Button -->
    <button id="ai-assistant-button" class="ai-assistant-button" type="button" aria-label="Open TACTIOPBOT Assistant" aria-expanded="false">
      <img src="/media/images/logos/tactiopbot-logo.png.jpeg" alt="" class="ai-assistant-logo">
      <span class="ai-assistant-badge" aria-hidden="true"></span>
    </button>
    <div id="ai-assistant-panel" class="ai-assistant-panel hidden" role="dialog" aria-label="TACTIOPBOT Assistant" aria-modal="true">
      <div class="ai-assistant-header">
        <h2>TACTIOPBOT Assistant</h2>
        <button id="ai-assistant-close" class="ai-assistant-close" type="button" aria-label="Close assistant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="ai-assistant-messages" id="ai-assistant-messages" role="log" aria-live="polite" aria-label="Assistant messages">
        <div class="ai-message ai-message-bot">
          <div class="ai-message-avatar">
            <img src="/media/images/logos/tactiopbot-logo.png.jpeg" alt="">
          </div>
          <div class="ai-message-content">
            <p>Welcome! I'm your TACTIOPBOT assistant. How can I help you today?</p>
          </div>
        </div>
      </div>
      <form class="ai-assistant-input" id="ai-assistant-form">
        <label class="visually-hidden" for="ai-assistant-input">Ask TACTIOPBOT assistant</label>
        <input type="text" id="ai-assistant-input" placeholder="Ask about missions, clan wars, settings..." autocomplete="off" maxlength="500">
        <button type="submit" class="ai-assistant-send" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
      <div class="ai-assistant-quick-actions" role="group" aria-label="Quick actions">
        <button type="button" class="ai-quick-action" data-action="missions">Clan Missions</button>
        <button type="button" class="ai-quick-action" data-action="clan-war">Clan War Manager</button>
        <button type="button" class="ai-quick-action" data-action="settings">Settings</button>
        <button type="button" class="ai-quick-action" data-action="help">Help</button>
      </div>
    </div>
  </body>
</html>
